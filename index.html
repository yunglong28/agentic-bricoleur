<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Agentic Bricoleur</title>
<style>
:root { --bg: #eeebe4; --ink: #1a1715 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #161412; --ink: #ece7de; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #161412; --ink: #ece7de; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); margin: 0 }
.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; padding: 16px; max-width: 1600px; margin: 0 auto }
.grid button { all: unset; cursor: zoom-in; display: block; aspect-ratio: 4 / 5; max-width: 100% }
.grid button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px }
.grid img { width: 100%; height: 100%; object-fit: cover; display: block }
.loupe { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: grid; place-items: center; padding: 16px; cursor: zoom-out }
.loupe img { max-width: 100%; max-height: calc(100vh - 32px); width: auto; height: auto }
@media (max-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)) } }
@media (max-width: 600px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px } }
</style>
</head>
<body>

<div class="grid" id="grid"></div>
<div class="loupe" id="loupe" hidden><img id="limg" alt=""></div>

<script>
const files = [
  's1-01-the-loop', 's1-02-the-tile', 's1-03-the-room', 's1-04-the-operator', 's1-05-the-rig',
  's2-01-the-loop', 's2-02-the-tile', 's2-03-the-room', 's2-04-the-operator', 's2-05-the-rig',
  's3-01-the-loop', 's3-02-the-tile', 's3-03-the-room', 's3-04-the-operator', 's3-05-the-rig',
  'ar-a1-access-to-tools', 'ar-a2-drop-city', 'ar-a3-lib-dream', 'ar-a4-human-use', 'ar-a5-radical-terrain',
  'gu-g1-guild-arms', 'gu-g2-prozodezhda', 'gu-g3-supersurface', 'gu-g4-the-vine', 'gu-g5-rose-window',
].map(f => `img/${f}.jpg`);
const grid = document.getElementById('grid'), loupe = document.getElementById('loupe'), limg = document.getElementById('limg');
let cur = 0;
const show = i => { cur = (i + files.length) % files.length; limg.src = files[cur]; };
files.forEach((src, i) => {
  const b = document.createElement('button');
  b.innerHTML = `<img src="${src}" alt="" loading="lazy" width="1024" height="1280">`;
  b.onclick = () => { show(i); loupe.hidden = false; };
  grid.append(b);
});
loupe.onclick = () => { loupe.hidden = true; };
document.addEventListener('keydown', e => {
  if (loupe.hidden) return;
  if (e.key === 'Escape') loupe.hidden = true;
  if (e.key === 'ArrowRight') show(cur + 1);
  if (e.key === 'ArrowLeft') show(cur - 1);
});
</script>
</body>
</html>
