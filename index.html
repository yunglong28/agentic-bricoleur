<style>
:root { --bg: #eeebe4; --ink: #1a1715; --dim: #7d776d; --red: #e6331f; --rule: #d6d1c7 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #161412; --ink: #ece7de; --dim: #8d877d; --red: #f93922; --rule: #2c2925; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #161412; --ink: #ece7de; --dim: #8d877d; --red: #f93922; --rule: #2c2925; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); margin: 0; font: 13px/1.45 Menlo, ui-monospace, SFMono-Regular, monospace }
a { color: inherit; text-underline-offset: 3px }
a:hover { color: var(--red) }
.wrap { max-width: 1600px; margin: 0 auto; padding: 0 16px }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; padding: 28px 0 8px }
header.top h1 { font-size: 15px; margin: 0 }
nav.toc { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--dim); padding-bottom: 20px; border-bottom: 1px solid var(--rule) }
nav.toc a { text-decoration: none }
section { padding: 28px 0 8px }
section h2 { display: flex; gap: 14px; align-items: baseline; font-size: 13px; margin: 0 0 14px }
section h2 .n { color: var(--red); font-weight: 400 }
section h2 .c { color: var(--dim); font-weight: 400 }
section h2 .d { color: var(--dim); font-weight: 400; margin-left: auto; text-align: right }
.grid { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 16px }
.mason { columns: 4; column-gap: 16px }
.mason button { margin-bottom: 16px; break-inside: avoid }
.grid button, .mason button { all: unset; cursor: zoom-in; display: block; width: 100%; position: relative }
.grid button:focus-visible, .mason button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px }
.grid img, .mason img { width: 100%; height: auto; display: block; background: var(--rule) }
.cap { display: block; color: var(--dim); font-size: 11px; padding-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
ul.files { columns: 3; padding: 0; margin: 0; list-style: none }
ul.files li { padding: 2px 0 }
footer { color: var(--dim); padding: 40px 0 32px; border-top: 1px solid var(--rule); margin-top: 32px }
.loupe { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: grid; grid-template-rows: 1fr auto; padding: 16px; }
.loupe .stage { min-height: 0; display: grid; place-items: center; cursor: zoom-out }
.loupe img { max-width: 100%; max-height: calc(100vh - 90px); width: auto; height: auto; display: block }
.loupe .bar { display: flex; gap: 16px; align-items: baseline; padding-top: 12px }
.loupe .bar .n { color: var(--red) }
.loupe .bar .t { color: var(--dim); flex: 1; min-width: 0 }
.loupe button.nav { all: unset; cursor: pointer; font-size: 18px; padding: 0 6px }
.loupe button.nav:hover { color: var(--red) }
@media (max-width: 1000px) { .grid { --cols: var(--cols-m) !important } .mason { columns: 3 } ul.files { columns: 2 } }
@media (max-width: 600px) { .grid { --cols: var(--cols-s) !important; gap: 10px } .mason { columns: 2; column-gap: 10px } .mason button { margin-bottom: 10px } section h2 { flex-wrap: wrap } section h2 .d { margin-left: 0; text-align: left; flex-basis: 100% } ul.files { columns: 1 } }
</style>
</head>
